name: Pemeriksaan

# Repo ini tidak punya build step, package manager, atau test runner — deploy-nya
# langsung dari branch main ke GitHub Pages. Workflow ini BUKAN untuk deploy
# (Pages sudah menangani itu sendiri), tapi untuk menahan kesalahan yang kalau
# lolos cuma ketahuan setelah dibuka di browser pengguna.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: Pemeriksaan statis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Riwayat penuh: pemeriksaan CACHE_NAME perlu membandingkan sw.js
          # dengan commit pembanding.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Instrumennya divalidasi dulu sebelum hasilnya dipercaya: selftest
      # menyuntikkan cacat buatan dan memastikan check.js benar-benar menolaknya.
      # Tanpa ini, check.js yang rusak akan selalu hijau tanpa ada yang sadar.
      - name: Self-test pemeriksa
        run: node scripts/selftest.js

      - name: Pemeriksaan statis
        run: node scripts/check.js

      # Uji perilaku engine ICT (candle sintetis: skenario sweep+MSS, cerminnya, gate bias HTF, fuzz).
      - name: Uji engine ICT
        run: node scripts/test-ict.js

      # Uji model Unicorn & Inverse Blueprint (IFVG) terhadap aturan di kedua berkas panduan.
      - name: Uji model Unicorn & IFVG
        run: node scripts/test-ict-models.js

      # Uji pelacak Decision: armed -> RUNNING -> TP/SL/void, aturan candle konservatif, SL close-based, cermin long/short.
      - name: Uji pelacak Decision
        run: node scripts/test-ict-track.js

      - name: Bump CACHE_NAME
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/check-cache-bump.js
